name: Prepare licensed falcon audio
on:
  push:
    branches: [feature/falcon-audio]
    paths: [.github/workflows/prepare-falcon-audio.yml]
permissions:
  contents: write
concurrency:
  group: prepare-falcon-audio
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ensure audio encoder is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Import pinned recording and prepare the short sound cue
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request
          repo = os.environ['REPOSITORY']
          branch = 'feature/falcon-audio'
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          def api(path, body=None, method=None):
              req = urllib.request.Request(base + path, data=None if body is None else json.dumps(body).encode(), headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          head = api('/git/ref/heads/' + branch)['object']['sha']
          if head != os.environ['EXPECTED_HEAD']:
              raise RuntimeError('Branch changed; refusing to overwrite new work.')
          commit = api('/git/commits/' + head)
          page = api('/contents/index.html?ref=' + head)
          if page['sha'] != 'f7904a0ab7a1ee4ca7c7eb0ab729adbf48be2848':
              raise RuntimeError('Unexpected page version; inspect before modifying.')
          html = base64.b64decode(page['content']).decode('utf-8')
          anchor = '  <script src="assets/intro-v1.js" defer></script>'
          if html.count(anchor) != 1:
              raise RuntimeError('Expected intro script anchor missing.')
          html = html.replace(anchor, '  <script src="assets/falcon-sound-v1.js" defer></script>\n' + anchor)
          # The external host receives NO GitHub credentials.
          source_url = 'https://birdsound.org/assets/audio/705937.mp3'
          request = urllib.request.Request(source_url, headers={'User-Agent': 'SBMSHS-Music-Audio-Import/1.0'})
          with urllib.request.urlopen(request, timeout=60) as response:
              recording = response.read(2_000_001)
          expected = 'af6bbd79743b4a9019c3bbdc833b8cde9d5659725ecea8e51e63f330c73f4c58'
          if hashlib.sha256(recording).hexdigest() != expected:
              raise RuntimeError('Recording checksum mismatch.')
          with tempfile.TemporaryDirectory() as tmp:
              original = pathlib.Path(tmp) / 'source.mp3'
              result = pathlib.Path(tmp) / 'falcon-call-v1.mp3'
              original.write_bytes(recording)
              subprocess.run(['ffmpeg', '-nostdin', '-hide_banner', '-loglevel', 'error', '-ss', '1.45', '-i', str(original), '-t', '2.5', '-map_metadata', '-1', '-ac', '1', '-ar', '44100', '-af', 'highpass=f=180,afade=t=in:st=0:d=0.035,afade=t=out:st=2.28:d=0.22,volume=1.5', '-codec:a', 'libmp3lame', '-b:a', '96k', '-y', str(result)], check=True, timeout=30)
              encoded = result.read_bytes()
              probe = json.loads(subprocess.check_output(['ffprobe', '-v', 'error', '-show_entries', 'format=duration,size', '-of', 'json', str(result)], timeout=15))
          if not (2.4 < float(probe['format']['duration']) < 2.7) or len(encoded) > 60000:
              raise RuntimeError('Unexpected audio output.')
          credits = '''Falcon-call audio credit
          Species: Peregrine Falcon (Falco peregrinus).
          Recordist: Sonothèque ADVL.
          Original recording: XC705937, https://xeno-canto.org/705937
          License: CC0 1.0 / public-domain dedication.
          License reference: https://creativecommons.org/publicdomain/zero/1.0/
          Source mirror: https://birdsound.org/assets/audio/705937.mp3
          Mirror/license listing: https://birdsound.org/species/falco-peregrinus.html
          Corroborating listing: https://birdyapp.net/birds/falco-peregrinus/
          Source SHA-256: af6bbd79743b4a9019c3bbdc833b8cde9d5659725ecea8e51e63f330c73f4c58
          Adaptation: 2.5-second excerpt beginning at 1.45 seconds; high-pass at
          180 Hz, short fade-in/out, gain adjustment, mono 44.1 kHz / 96 kbps MP3.
          Hosted locally. No original-recording host is contacted by site visitors.
          '''
          credits = '\n'.join(line.strip() for line in credits.splitlines()) + '\n'
          audio_blob = api('/git/blobs', {'content': base64.b64encode(encoded).decode(), 'encoding': 'base64'})['sha']
          entries = [
              {'path': 'assets/falcon-call-v1.mp3', 'mode': '100644', 'type': 'blob', 'sha': audio_blob},
              {'path': 'assets/audio-credits.txt', 'mode': '100644', 'type': 'blob', 'content': credits},
              {'path': 'index.html', 'mode': '100644', 'type': 'blob', 'content': html},
              {'path': '.github/workflows/prepare-falcon-audio.yml', 'mode': '100644', 'type': 'blob', 'sha': None}
          ]
          tree = api('/git/trees', {'base_tree': commit['tree']['sha'], 'tree': entries})['sha']
          new_commit = api('/git/commits', {'message': 'Store verified falcon sound and connect opt-in intro audio', 'tree': tree, 'parents': [head]})['sha']
          if api('/git/ref/heads/' + branch)['object']['sha'] != head:
              raise RuntimeError('Branch changed during preparation.')
          api('/git/refs/heads/' + branch, {'sha': new_commit, 'force': False}, 'PATCH')
          print(json.dumps({'commit': new_commit, 'audio_bytes': len(encoded), 'audio_sha256': hashlib.sha256(encoded).hexdigest(), 'probe': probe}))
